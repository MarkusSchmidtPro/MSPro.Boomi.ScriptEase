<!DOCTYPE html>
<html lang="de">
    <head>
        <title>Certificate Report</title>
        <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
    </head>
    <body>
        <article>
            <header>
                <hgroup>
                    <h2 id="headline">Certificates expiring or expired
                    </h3>
                </hgroup>
                <p>Count: 15</p>
            </header>
            <main>
                <table>
                    <thead>
                        <th>Name</th>
                        <th>Runtime</th>
                        <th>Expiration</th>
                        <th>Type</th>
                    </thead>
                    <tbody>
                         <!-- Freemarker
                            <#list result?sort_by( "environmentName") as cert>
                            1. Parse the ISO string into a real Date object
                            <#assign parsedDate = cert.expirationDate?datetime("yyyy-MM-dd'T'HH:mm:ssX")>
                            2. Define your "One Week From Now" threshold
                            <#assign oneWeekMillis = .now?long + (7 * 24 * 60 * 60 * 1000)>
                            3. Compare and assign
                            <#assign x = (parsedDate?long < oneWeekMillis)?string("red", "blue")>
                         -->
                        <tr>
                            <td style="font-weight: bold;">${cert.certificateName}</td>
                            <td>${cert.environmentName}</td>
                            <td style="color: ${x}">${cert.expirationDate}</td>
                            <td>${cert.certificateType}</td>
                        </tr>
                        <!-- </#list> -->
                    </tbody>
                </table>
            </ul>
        </main>
        <footer>
            Printed on ${.now?iso_utc}
        </footer>
    </article>
</body>
